<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>D'NIPAR Cafe — Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b1d14;
    --cream:#f7efe0;
    --card:#fffdf8;
    --rust:#a65a2e;
    --rust-dark:#7c4321;
    --gold:#b1892c;
    --line:#e3d5ba;
    --muted:#8a7a63;
    color-scheme: light;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Work Sans',system-ui,sans-serif;
    background:var(--cream);
    color:var(--ink);
    padding-bottom:100px;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:calc(100px + env(safe-area-inset-bottom,0px));
  }
  .wrap{max-width:600px;margin:0 auto;padding:0 18px;}

  /* Hero */
  .hero{
    background:
      radial-gradient(circle at 15% -10%, rgba(255,255,255,0.08), transparent 55%),
      linear-gradient(180deg,var(--rust-dark),var(--rust) 70%);
    color:#fbf3e6;
    padding:38px 18px 46px;
    text-align:center;
    border-bottom:6px solid var(--gold);
    position:relative;
  }
  .hero .kicker{
    font-size:12px;
    letter-spacing:.14em;
    color:#f0d9b8;
    margin:0 0 6px;
  }
  .hero h1{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:44px;
    line-height:1;
    margin:0;
    letter-spacing:.01em;
  }
  .hero .tagline{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:400;
    font-size:16px;
    margin:8px 0 0;
    color:#f3e2c4;
  }

  /* Order details card */
  .order-card{
    background:var(--card);
    margin:-26px 18px 0;
    padding:20px;
    border-radius:14px;
    box-shadow:0 10px 26px rgba(60,32,10,0.14);
    position:relative;
    z-index:2;
  }
  .order-card label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--rust-dark);
    margin-bottom:6px;
  }
  .order-card input[type="text"]{
    width:100%;
    padding:11px 12px;
    margin-bottom:14px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
    background:#fffef9;
    color:var(--ink);
  }
  .order-card input[type="text"]:last-of-type{margin-bottom:0;}
  .order-card input[type="text"]:focus{outline:2px solid var(--gold); outline-offset:1px;}

  /* Category nav */
  .cat-nav{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:20px 18px 6px;
    scrollbar-width:none;
  }
  .cat-nav::-webkit-scrollbar{display:none;}
  .cat-nav a{
    flex:0 0 auto;
    font-size:12.5px;
    font-weight:600;
    color:var(--rust-dark);
    background:#fff8ec;
    border:1px solid var(--line);
    padding:8px 14px;
    border-radius:999px;
    text-decoration:none;
    white-space:nowrap;
  }

  .container{padding:6px 18px 0;}

  /* Category header — menu-board ticket style */
  .category-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:20px;
    color:var(--rust-dark);
    margin:30px 0 4px;
    padding-bottom:8px;
    border-bottom:2px solid var(--ink);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    scroll-margin-top:14px;
  }
  .category-title span.count{
    font-family:'Work Sans',sans-serif;
    font-size:11px;
    font-weight:500;
    color:var(--muted);
  }

  .menu-list{margin-bottom:6px;}
  .menu-item{
    padding:14px 0;
    border-bottom:1px dashed var(--line);
  }
  .menu-item:last-child{border-bottom:none;}
  .menu-row{
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .menu-title{
    font-weight:600;
    font-size:14.5px;
    color:var(--ink);
  }
  .dots{
    flex:1;
    border-bottom:1px dotted #c9b995;
    transform:translateY(-3px);
    min-width:10px;
  }
  .menu-price{
    font-weight:700;
    font-size:14px;
    color:var(--gold);
    white-space:nowrap;
  }
  .qty-container{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:9px;
  }
  .pick-toggle{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12.5px;
    color:var(--muted);
    cursor:pointer;
    user-select:none;
  }
  .pick-toggle input[type="checkbox"]{
    width:18px;height:18px;
    accent-color:var(--rust);
    cursor:pointer;
  }
  .qty-input{
    width:52px;
    padding:5px 6px;
    border:1px solid var(--line);
    border-radius:6px;
    text-align:center;
    font-family:inherit;
    font-size:13px;
    color:var(--ink);
    background:#fffef9;
  }
  .menu-item.is-selected{background:#fff6e6; margin:0 -12px; padding:14px 12px; border-radius:8px;}

  /* Sticky footer */
  .sticky-footer{
    position:fixed; left:0; right:0; bottom:0;
    background:var(--card);
    padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));
    box-shadow:0 -6px 20px rgba(60,32,10,0.15);
    display:flex; justify-content:space-between; align-items:center;
    max-width:600px; margin:0 auto;
    border-top:2px solid var(--gold);
    z-index:100;
  }
  .total-label{font-size:11px; color:var(--muted); letter-spacing:.03em;}
  .total-amount{font-family:'Fraunces',serif; font-weight:700; font-size:20px; color:var(--rust-dark);}
  .btn-send{
    background:#22a457;
    color:#fff;
    border:none;
    padding:13px 22px;
    border-radius:9px;
    font-family:'Work Sans',sans-serif;
    font-weight:600;
    font-size:14.5px;
    cursor:pointer;
  }
  .btn-send:active{transform:translateY(1px);}

  @media (max-width:380px){
    .hero h1{font-size:36px;}
  }
</style>
</head>
<body>

  <div class="hero">
    <p class="kicker">SELAMAT DATANG DI</p>
    <h1>D'NIPAR</h1>
    <p class="tagline">cafe &amp; menu — dari kopi pagi sampai malam panjang</p>
  </div>

  <div class="order-card">
    <label for="nama">Nama Pemesan</label>
    <input type="text" id="nama" placeholder="Masukkan nama Anda" required>
    <label for="alamat">Alamat Pengiriman / No. Meja</label>
    <input type="text" id="alamat" placeholder="Ketik lokasi atau No. Meja" required>
  </div>

  <nav class="cat-nav" id="cat-nav"></nav>

  <div class="wrap container" id="menu-container"></div>

  <div class="sticky-footer">
    <div>
      <div class="total-label">TOTAL PESANAN <span style="opacity:.75;">(+15,5%)</span></div>
      <div id="total-display" class="total-amount">Rp 0</div>
    </div>
    <button class="btn-send" onclick="kirimWA()">Kirim ke WA</button>
  </div>

<script>
const menuData = [
  { kategori:"MAIN COURSE", items:[
    { nama:"Chicken Cordon Blue (Rice)", harga:39000 },
    { nama:"Chicken Cordon Blue (French Fries)", harga:41000 },
    { nama:"Meat Rolade (Rice)", harga:40000 },
    { nama:"Meat Rolade (French Fries)", harga:42000 },
    { nama:"Nasi Goreng Nipar", harga:36000 },
    { nama:"Mie Sultan Creamy", harga:30000 },
    { nama:"Mie Sultan Fried", harga:30000 },
    { nama:"Mie Sultan Nipar", harga:30000 },
    { nama:"Nipar Breakfast: Baked Beans", harga:12000 },
    { nama:"Nipar Breakfast: Kernel Corn", harga:12000 },
    { nama:"Nipar Breakfast: Baked Beef", harga:12000 },
    { nama:"Nipar Breakfast: Baked Saussage", harga:12000 },
    { nama:"Nipar Breakfast: Sunny Side Up/Scramble Egg", harga:12000 },
    { nama:"Nipar Breakfast: Hashbrown", harga:12000 }
  ]},
  { kategori:"BREAD & SNACK", items:[
    { nama:"Meat n Egg Toast", harga:27000 },
    { nama:"Waffle", harga:24000 },
    { nama:"Garlic Toast", harga:22000 },
    { nama:"Choccolatte Toast", harga:22000 },
    { nama:"Tiramisu Toast", harga:22000 },
    { nama:"Matcha Toast", harga:22000 },
    { nama:"Hazelnut Toast", harga:22000 },
    { nama:"Strawberry Toast", harga:22000 },
    { nama:"Butter Toast", harga:22000 },
    { nama:"Cheese Toast", harga:22000 },
    { nama:"Cream Toast", harga:22000 },
    { nama:"French Fries", harga:22000 },
    { nama:"Singkong Keju", harga:20000 },
    { nama:"Pempek", harga:25000 },
    { nama:"Pisang", harga:20000 },
    { nama:"Otak-otak", harga:22000 },
    { nama:"Cireng", harga:20000 }
  ]},
  { kategori:"COFFEE", items:[
    { nama:"Double Ristretto/Expresso", harga:19000 },
    { nama:"Black Coffe (Americano/Long Black)", harga:25000 },
    { nama:"Mont Blanc", harga:31000 },
    { nama:"Black Honey", harga:31000 },
    { nama:"Affogato", harga:30000 }
  ]},
  { kategori:"WHITE COFFEE", items:[
    { nama:"Piccolo Latte", harga:25000 },
    { nama:"Caffe Latte", harga:28000 },
    { nama:"Cappucino", harga:28000 },
    { nama:"Flat White", harga:28000 },
    { nama:"Dirty Latte", harga:28000 },
    { nama:"Moccacino", harga:28000 },
    { nama:"Caffe Latte Flavour", harga:29000 },
    { nama:"Ice Bom Latte", harga:28000 }
  ]},
  { kategori:"SIGNATURE NIPAR", items:[
    { nama:"Nipar Latte", harga:34000 },
    { nama:"Nipar Java", harga:34000 },
    { nama:"Nipar Spanish", harga:32000 },
    { nama:"Nipar Butter Scoth", harga:34000 },
    { nama:"Nipar Salt n Caramel", harga:34000 },
    { nama:"Nipar Pistachio", harga:34000 },
    { nama:"Nipar Pandan", harga:34000 },
    { nama:"Matchapresso", harga:33000 },
    { nama:"Nipar Milk", harga:32000 },
    { nama:"Add on Shake n Blend", harga:5000 }
  ]},
  { kategori:"TEA & NON-COFFEE", items:[
    { nama:"Plain Tea", harga:18000 },
    { nama:"Lemon Tea", harga:24000 },
    { nama:"Lychee Tea", harga:28000 },
    { nama:"Thai Tea", harga:28000 },
    { nama:"Tea Pot (Chamomile/English Breakfast/Mint)", harga:30000 },
    { nama:"Choccolatte", harga:32000 },
    { nama:"Chocco Roast", harga:32000 },
    { nama:"Matcha", harga:32000 },
    { nama:"Matchalatte", harga:32000 },
    { nama:"Matcha Pista", harga:34000 },
    { nama:"Matcha Stawberry", harga:34000 },
    { nama:"Bubblegum", harga:32000 },
    { nama:"Milk", harga:15000 },
    { nama:"Mineral", harga:6000 },
    { nama:"Mineral Pitcher", harga:20000 }
  ]}
];

const fmt = n => new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',minimumFractionDigits:0}).format(n);
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'-');

const nav = document.getElementById('cat-nav');
const container = document.getElementById('menu-container');

menuData.forEach(cat => {
  const id = slug(cat.kategori);

  const navLink = document.createElement('a');
  navLink.href = '#'+id;
  navLink.textContent = cat.kategori;
  nav.appendChild(navLink);

  const title = document.createElement('div');
  title.className = 'category-title';
  title.id = id;
  title.innerHTML = `<span>${cat.kategori}</span><span class="count">${cat.items.length} menu</span>`;
  container.appendChild(title);

  const list = document.createElement('div');
  list.className = 'menu-list';

  cat.items.forEach((item,idx) => {
    const row = document.createElement('div');
    row.className = 'menu-item';
    row.innerHTML = `
      <div class="menu-row">
        <span class="menu-title">${item.nama}</span>
        <span class="dots"></span>
        <span class="menu-price">${fmt(item.harga)}</span>
      </div>
      <div class="qty-container">
        <label class="pick-toggle">
          <input type="checkbox" class="item-checkbox" value="${item.nama}" data-harga="${item.harga}">
          Pilih
        </label>
        <input type="number" class="qty-input" min="1" value="1">
      </div>`;
    const cb = row.querySelector('.item-checkbox');
    const qty = row.querySelector('.qty-input');
    cb.addEventListener('change', ()=>{ row.classList.toggle('is-selected', cb.checked); hitungTotal(); });
    qty.addEventListener('change', hitungTotal);
    list.appendChild(row);
  });
  container.appendChild(list);
});

function hitungTotal(){
  let total = 0;
  document.querySelectorAll('.item-checkbox').forEach(cb=>{
    if(cb.checked){
      const qty = parseInt(cb.closest('.menu-item').querySelector('.qty-input').value) || 1;
      total += parseInt(cb.dataset.harga) * qty;
    }
  });
  const totalAkhir = Math.round(total * 1.155);
  document.getElementById('total-display').textContent = fmt(totalAkhir);
}

function kirimWA(){
  const nomorWA = "6281953333381"; // Nomor WA D'NIPAR Cafe
  const nama = document.getElementById('nama').value;
  const alamat = document.getElementById('alamat').value;

  if(!nama || !alamat){
    alert("Mohon isi Nama Pemesan dan Alamat/No. Meja terlebih dahulu.");
    return;
  }

  let pesanan = "";
  let total = 0;
  document.querySelectorAll('.item-checkbox').forEach(cb=>{
    if(cb.checked){
      const qty = parseInt(cb.closest('.menu-item').querySelector('.qty-input').value) || 1;
      const harga = parseInt(cb.dataset.harga);
      const subtotal = harga * qty;
      pesanan += `- ${qty}x ${cb.value} (Rp ${new Intl.NumberFormat('id-ID').format(subtotal)})\n`;
      total += subtotal;
    }
  });

  if(pesanan === ""){
    alert("Mohon pilih (centang) minimal 1 menu sebelum mengirim pesanan.");
    return;
  }

  const biayaLayanan = Math.round(total * 0.155);
  const totalAkhir = total + biayaLayanan;
  const fmtId = n => new Intl.NumberFormat('id-ID').format(n);

  const teksWA = `Halo D'NIPAR Cafe, saya ingin memesan:\n\n*Nama:* ${nama}\n*Lokasi/Meja:* ${alamat}\n\n*Pesanan:*\n${pesanan}\nSubtotal: Rp ${fmtId(total)}\nPajak & Service (15,5%): Rp ${fmtId(biayaLayanan)}\n*Total Pembayaran:* Rp ${fmtId(totalAkhir)}\n\nMohon segera diproses ya, terima kasih!`;
  window.open(`https://wa.me/${nomorWA}?text=${encodeURIComponent(teksWA)}`, '_blank');
}
</script>
</body>
</html>
